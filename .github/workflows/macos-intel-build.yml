name: macOS Intel (x86-64) Build & Package

on:
  workflow_dispatch:
    inputs:
      python_version:
        description: 'Python sürümü'
        required: false
        default: '3.12'
        type: choice
        options:
          - '3.10'
          - '3.11'
          - '3.12'
          - '3.13'

  push:
    branches: [main]
    tags: ['v*']

  pull_request:
    branches: [main]

concurrency:
  group: macos-intel-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: macOS Intel (x86-64) Paketle & Derle
    runs-on: macos-15-intel

    permissions:
      contents: read

    env:
      PYTHON_VERSION: "${{ github.event.inputs.python_version || '3.12' }}"

    steps:
      # ---------------------------------------------------------------
      # 1) Repoyu klonla
      # ---------------------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      # ---------------------------------------------------------------
      # 2) Python kur
      # ---------------------------------------------------------------
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      # ---------------------------------------------------------------
      # 3) uv kur
      # ---------------------------------------------------------------
      - name: Install uv
        uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          version: "0.13.4"
          python-version: ${{ env.PYTHON_VERSION }}
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      # ---------------------------------------------------------------
      # 4) Platform ve mimari doğrulaması
      # ---------------------------------------------------------------
      - name: Show platform info
        run: |
          uname -a
          uname -m
          arch
          python3 --version
          uv --version

          echo "---"

          if [ "$(uname -m)" != "x86_64" ]; then
            echo "::error::Bu runner Intel x86-64 DEĞİL!"
            echo "Beklenen: x86_64"
            echo "Alınan: $(uname -m)"
            exit 1
          fi

          echo "Intel x86-64 mimarisi doğrulandı."

      # ---------------------------------------------------------------
      # 5) Workspace paketlerini derle (wheel + sdist)
      # ---------------------------------------------------------------
      
      - name: Build all packages (wheel + sdist)
        shell: bash
        run: |
          echo "=== Repository checkout ==="
          echo "GitHub workspace: $GITHUB_WORKSPACE"
          pwd
          ls -lah "$GITHUB_WORKSPACE"

          # Workspace kökünü bul
          WORKSPACE_ROOT=""

          if [ -f "$GITHUB_WORKSPACE/pyproject.toml" ] && \
             grep -q '^\[tool\.uv\.workspace\]' "$GITHUB_WORKSPACE/pyproject.toml"; then
            WORKSPACE_ROOT="$GITHUB_WORKSPACE"
          else
            while IFS= read -r file; do
              if grep -q '^\[tool\.uv\.workspace\]' "$file"; then
                WORKSPACE_ROOT="$(dirname "$file")"
                break
              fi
            done < <(find "$GITHUB_WORKSPACE" -maxdepth 5 -type f -name pyproject.toml)
          fi

          # Workspace bulunamazsa açık hata ver
          if [ -z "$WORKSPACE_ROOT" ]; then
            echo "::error::CrewAI workspace pyproject.toml bulunamadı!"
            echo "Bulunan pyproject.toml dosyaları:"
            find "$GITHUB_WORKSPACE" -maxdepth 5 -name pyproject.toml -print
            exit 1
          fi

          echo "=== Workspace root ==="
          echo "$WORKSPACE_ROOT"

          # Artifact klasörünü oluştur
          mkdir -p "$GITHUB_WORKSPACE/dist"

          # Bütün workspace paketlerini derle
          uv build --all-packages "$WORKSPACE_ROOT" \
            --out-dir "$GITHUB_WORKSPACE/dist"

          rm -f "$GITHUB_WORKSPACE/dist/.gitignore"

          echo "=== Built packages ==="
          ls -lah "$GITHUB_WORKSPACE/dist"

          # En az bir wheel üretildiğini doğrula
          if ! compgen -G "$GITHUB_WORKSPACE/dist/*.whl" > /dev/null; then
            echo "::error::Build tamamlandı ancak wheel üretilmedi!"
            exit 1
          fi

          echo "✅ Workspace paketleri başarıyla derlendi."


      # ---------------------------------------------------------------
      # 6) Wheel kurulum ve import testleri
      # ---------------------------------------------------------------
      - name: Install & verify built wheels
        run: |
          # pip içeren ayrı bir sanal ortam oluştur
          uv venv --seed /tmp/crewai-venv \
            --python "${{ env.PYTHON_VERSION }}"

          source /tmp/crewai-venv/bin/activate

          failed=0

          shopt -s nullglob
          wheels=(dist/*.whl)

          if [ ${#wheels[@]} -eq 0 ]; then
            echo "::error::dist klasöründe wheel bulunamadı!"
            exit 1
          fi

          for wheel in "${wheels[@]}"; do
            pkg_name=$(basename "$wheel" | sed 's/-[0-9].*//' | tr '-' '_')

            echo "=== Testing $pkg_name ($(basename "$wheel")) ==="

            case "$pkg_name" in

              crewai_core)
                if pip install "$wheel" --quiet; then
                  if ! python -c "
          import crewai_core
          print('crewai_core import OK')
          "; then
                    failed=1
                  fi
                else
                  echo "crewai_core pip install başarısız"
                  failed=1
                fi
                ;;

              crewai)
                if pip install "$wheel" --quiet; then
                  if ! python -c "
          import crewai
          print('crewai import OK')
          print('Version:', getattr(crewai, '__version__', 'N/A'))
          "; then
                    failed=1
                  fi
                else
                  echo "crewai pip install başarısız"
                  failed=1
                fi
                ;;

              crewai_cli)
                if pip install "$wheel" --quiet; then
                  if ! python -c "
          from crewai_cli.cli import crewai
          print('crewai_cli import OK')
          "; then
                    failed=1
                  fi
                else
                  echo "crewai_cli pip install başarısız"
                  failed=1
                fi
                ;;

              crewai_files)
                echo "crewai_files build edildi."
                echo "Import testi atlandı."
                ;;

              crewai_tools)
                echo "crewai_tools build edildi."
                echo "Import testi atlandı."
                ;;

              *)
                echo "Bilinmeyen paket: $pkg_name"
                echo "Build doğrulandı; import testi atlandı."
                ;;
            esac
          done

          # CLI doğrulaması
          echo "=== crewai CLI doğrulaması ==="

          if command -v crewai >/dev/null 2>&1; then
            if crewai --help >/dev/null 2>&1; then
              echo "crewai CLI çalışıyor."
            else
              echo "crewai CLI çalıştırılamadı."
              failed=1
            fi
          else
            echo "crewai CLI komutu bulunamadı."
            failed=1
          fi

          if [ "$failed" -eq 1 ]; then
            echo "::error::Bazı paket testleri başarısız!"
            exit 1
          fi

          echo "Tüm paket testleri tamamlandı."

      # ---------------------------------------------------------------
      # 7) Ana paket smoke test
      # ---------------------------------------------------------------
      - name: Smoke test
        run: |
          source /tmp/crewai-venv/bin/activate

          python -c "
          import sys
          import crewai

          print(f'Python: {sys.version}')
          print(f'Platform: {sys.platform}')
          print(f'CrewAI version: {getattr(crewai, \"__version__\", \"N/A\")}')

          print('Smoke test başarılı.')
          "

      # ---------------------------------------------------------------
      # 8) Artifact yükle
      # ---------------------------------------------------------------
      - name: Upload dist artifacts
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08 # v4.6.0
        with:
          name: crewai-macos-intel-py${{ env.PYTHON_VERSION }}-dist
          path: dist/
          retention-days: 14
          if-no-files-found: error

      # ---------------------------------------------------------------
      # 9) Sonuç özeti
      # ---------------------------------------------------------------
      - name: Summary
        if: always()
        run: |
          echo "## Build Sonucu" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"

          echo "**Platform:** macOS 15 Intel (x86-64)" >> "$GITHUB_STEP_SUMMARY"
          echo "**Architecture:** x86_64" >> "$GITHUB_STEP_SUMMARY"
          echo "**Python:** ${{ env.PYTHON_VERSION }}" >> "$GITHUB_STEP_SUMMARY"

          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "### Derlenen Paketler" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"

          if [ -d dist ]; then
            for f in dist/*; do
              [ -f "$f" ] || continue
              echo "- \`$(basename "$f")\` ($(du -h "$f" | cut -f1))" >> "$GITHUB_STEP_SUMMARY"
            done
          else
            echo "Build çıktısı bulunamadı." >> "$GITHUB_STEP_SUMMARY"
          fi

          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "**Artifact:** \`crewai-macos-intel-py${{ env.PYTHON_VERSION }}-dist\`" >> "$GITHUB_STEP_SUMMARY"
